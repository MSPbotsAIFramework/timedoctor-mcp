[project]
name = "timedoctor-mcp"
version = "0.1.0"
description = "Time Doctor MCP server for the MSPbots Agent platform"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
  "mcp>=1.9.0,<2.0.0",
  "httpx>=0.27.0,<1.0.0",
  "pydantic>=2.6.0,<3.0.0",
  "pydantic-settings>=2.2.0,<3.0.0",
  "uvicorn>=0.29.0,<1.0.0",
  "starlette>=0.37.0,<1.0.0",
]

[project.scripts]
timedoctor-mcp = "timedoctor_mcp.__main__:main"

[dependency-groups]
dev = [
  "pytest>=8.0.0,<9.0.0",
  "pytest-asyncio>=0.23.0,<1.0.0",
  "respx>=0.21.0,<1.0.0",
  "asgi-lifespan>=2.1.0,<3.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/timedoctor_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
